name: Build NEXCAP LG receiver

on:
  workflow_dispatch:
  push:
    branches:
      - feature/bluestacks-manual-ps5
    paths:
      - 'webos/**'
      - '.github/workflows/build-lg.yml'

permissions:
  contents: read

jobs:
  build-lg:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify UDP on the webOS 3.5 Node.js version
        run: |
          curl -fsSL https://nodejs.org/dist/v0.12.2/node-v0.12.2-linux-x64.tar.gz -o legacy-node.tar.gz
          echo '4e1578efc2a2cc67651413a05ccc4c5d43f6b4329c599901c556f24d93cd0508  legacy-node.tar.gz' | sha256sum -c -
          tar -xzf legacy-node.tar.gz
          ./node-v0.12.2-linux-x64/bin/node webos/test-legacy.js
      - name: Build and verify LG IPK
        run: python3 webos/build.py
      - name: Upload LG installer
        uses: actions/upload-artifact@v4
        with:
          name: NEXCAP-PetrDevelop-LG-webOS
          path: |
            webos/dist/*.ipk
            webos/dist/*.zip
            webos/dist/receiver-manifest.json
          if-no-files-found: error
          retention-days: 30
